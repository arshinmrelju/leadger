<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Owner console sign in &middot; TrustX Ledger</title>
  <meta name="description" content="Sign in to the TrustX Ledger owner console" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#5b5bd6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="TrustX Ledger" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Nunito font — preconnect first, then load non-blocking -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" /></noscript>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="css/mobile.css" />

  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js",
      "firebase/database": "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js"
    }
  }
  </script>
</head>
<body class="fin-login-page" data-page="admin">
  <div class="fin-login-wrap">
    <div class="fin-login-card">
      <div class="fin-login-head">
        <img class="fin-login-logo" src="assets/logo.svg" alt="" width="30" height="30" />
        <span class="fin-login-brand">TrustX Ledger</span>
        <span class="fin-login-secure">SECURE</span>
      </div>
      <hr class="fin-login-rule" />
      <div class="fin-login">
        <div class="fin-login-emblem" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <span class="fin-eyebrow">Owner console</span>
        <h1 class="fin-login-title">TrustX Owner</h1>
        <p class="fin-login-sub">Sign in with your owner Google account to open the private console. The shop workspace is separate.</p>

        <div class="fin-login-meta">
          <span>CONSOLE MODE &bull; OWNER ONLY</span>
          <span id="receiptTimeDisplay"></span>
        </div>

        <div id="authAlert" class="alert alert-error is-hidden" role="alert" style="margin-bottom:0.75rem;">
          <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
          <span data-alert-msg></span>
        </div>

        <div id="googleSignInArea">
          <button type="button" class="btn-google" id="googleSignInBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            <span>Sign in with Google</span>
          </button>
        </div>

        <div class="fin-login-foot">OWNER ONLY &bull; TRUSTX LEDGER</div>
      </div>
    </div>

    <div class="fin-login-caption">
      TrustX Ledger &bull; Owner Console
    </div>
  </div>

  <script type="module">
    import { isConfigured, initFirebase } from "./js/firebase.js";
    import { registerServiceWorker } from "./js/pwa.js";
    import {
      initAuth,
      signInWithGoogle,
      enrollBrowser,
      getAccessGrant,
      reportError,
    } from "./js/auth.js";

    const alertBox = document.getElementById("authAlert");
    const alertMsg = alertBox.querySelector("[data-alert-msg]");
    const googleSignInBtn = document.getElementById("googleSignInBtn");
    const timeDisp = document.getElementById("receiptTimeDisplay");
    if (timeDisp) {
      try {
        const d = new Date();
        const day = String(d.getDate()).padStart(2, "0");
        const month = d.toLocaleString("en-US", { month: "short" }).toUpperCase();
        const year = d.getFullYear();
        timeDisp.textContent = `${day} ${month} ${year}`;
      } catch (_) {}
    }

    function showAlert(message, type = "error") {
      alertBox.classList.remove("is-hidden");
      alertBox.className = "alert alert-" + type;
      alertMsg.textContent = message;
    }
    function hideAlert() {
      alertBox.classList.add("is-hidden");
    }
    function setBtnLoading(loading) {
      googleSignInBtn.disabled = loading;
      googleSignInBtn.classList.toggle("is-loading", loading);
    }

    function goDashboard() {
      window.location.replace("admin.html");
    }

    async function boot() {
      if (!isConfigured()) {
        showAlert(
          "Firebase is not configured yet. Open js/firebase.js and add your web app config, then reload.",
          "warning"
        );
        googleSignInBtn.disabled = true;
        return;
      }

      const params = new URLSearchParams(window.location.search);
      if (params.get("reason") === "signedout") {
        showAlert("You have been signed out.", "info");
      } else if (params.get("reason") === "revoked") {
        showAlert("This browser's access was revoked. Sign in with Google to continue.", "info");
      } else if (params.get("reason") === "not-enrolled") {
        showAlert("This browser is not set up on this shop yet. Sign in with Google to continue.", "info");
      }

      /* A browser that is already trusted has no business on this page:
         the grant in Firestore is what the ledger actually checks, so
         send it straight through instead of making it sign in again. */
      try {
        await initAuth();
        const grant = await getAccessGrant();
        if (grant && grant.active === true) goDashboard();
      } catch (err) {
        /* Offline, or the read was denied: fall through to the button.
           The sign-in path below re-checks everything anyway. */
        console.warn("[trustx-ledger] auto sign-in check skipped:", err);
      }
    }

    boot();

    googleSignInBtn.addEventListener("click", async () => {
      hideAlert();
      setBtnLoading(true);
      try {
        await initFirebase();
        await signInWithGoogle();
        /* The email is checked here and never compared here: the rules in
           firestore.rules do the checking, against an allowlist only the
           Admin SDK could have written. */
        await enrollBrowser();
        goDashboard();
      } catch (err) {
        showAlert(reportError(err));
        setBtnLoading(false);
      }
    });
    registerServiceWorker();
  </script>
</body>
</html>
