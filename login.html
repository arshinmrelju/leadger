<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in &middot; SEVA LEDGER</title>
  <meta name="description" content="Sign in to SEVA LEDGER" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/responsive.css" />

  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js"
    }
  }
  </script>
</head>
<body class="auth-body" data-page="login">
  <main class="auth-card card">
    <img class="auth-logo" src="assets/logo.svg" alt="SEVA LEDGER logo" width="58" height="58" />
    <h1 class="auth-title">SEVA LEDGER</h1>
    <p class="auth-sub">Digital Service Shop Ledger</p>

    <div id="authAlert" class="alert alert-error is-hidden" role="alert">
      <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
      <span data-alert-msg></span>
    </div>

    <!-- The shop code -->
    <form id="codeForm" novalidate>
      <div class="field">
        <label for="codeInput">Shop code</label>
        <input class="input code-input input-lg" id="codeInput" name="code" type="password" autocomplete="one-time-code" maxlength="32" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;" autocapitalize="characters" />
        <span class="field-hint">Enter the shop code to open the ledger.</span>
      </div>
      <button type="submit" class="btn btn-accent btn-block btn-lg" id="codeSubmitBtn">Open ledger</button>
    </form>
  </main>

  <script type="module">
    import { isConfigured, initFirebase } from "./js/firebase.js";
    import {
      initAuth,
      onAuthStateChange,
      getCurrentUser,
      signInAnonymous,
      isCorrectCode,
      reportError,
    } from "./js/auth.js";

    const alertBox = document.getElementById("authAlert");
    const alertMsg = alertBox.querySelector("[data-alert-msg]");
    const codeForm = document.getElementById("codeForm");
    const codeInput = document.getElementById("codeInput");
    const codeSubmitBtn = document.getElementById("codeSubmitBtn");

    function showAlert(message, type = "error") {
      alertBox.classList.remove("is-hidden");
      alertBox.className = "alert alert-" + type;
      alertMsg.textContent = message;
    }
    function hideAlert() {
      alertBox.classList.add("is-hidden");
    }
    function setBtnLoading(loading) {
      codeSubmitBtn.disabled = loading;
      codeSubmitBtn.classList.toggle("is-loading", loading);
    }

    function goDashboard() {
      if (getCurrentUser()) window.location.replace("dashboard.html");
    }

    async function boot() {
      if (!isConfigured()) {
        showAlert(
          "Firebase is not configured yet. Open js/firebase.js and add your web app config, then reload.",
          "warning"
        );
        codeSubmitBtn.disabled = true;
        return;
      }
      initFirebase().catch(() => {});

      const params = new URLSearchParams(window.location.search);
      if (params.get("reason") === "signedout") {
        showAlert("You have been signed out.", "info");
      }

      try {
        await initAuth();
      } catch (err) {
        console.error("[seva-ledger] auth init failed:", err);
        showAlert(reportError(err), "warning");
        codeSubmitBtn.disabled = true;
        return;
      }

      /* A valid session already exists (the code was entered before):
         go straight in. Anonymous sessions are only created AFTER the
         code passes, so this cannot bypass the code. */
      onAuthStateChange((user) => {
        if (user) goDashboard();
      });
    }

    boot();

    codeForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      hideAlert();
      const code = codeInput.value;
      if (!code) {
        showAlert("Enter the shop code.");
        return;
      }
      if (!isCorrectCode(code)) {
        showAlert("That code is not recognised.");
        codeInput.focus();
        codeInput.select();
        return;
      }
      setBtnLoading(true);
      try {
        await signInAnonymous();
        goDashboard();
      } catch (err) {
        showAlert(reportError(err));
        setBtnLoading(false);
      }
    });
  </script>
</body>
</html>
