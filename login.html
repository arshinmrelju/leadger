<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in &middot; TrustX Ledger</title>
  <meta name="description" content="Sign in to TrustX Ledger" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <!-- Nunito font — preconnect first, then load non-blocking -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" /></noscript>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/responsive.css" />

  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js",
      "firebase/database": "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js"
    }
  }
  </script>
</head>
<body class="auth-body" data-page="login">
  <div class="receipt-wrapper">
    <!-- Top dispenser slot -->
    <div class="receipt-dispenser" aria-hidden="true">
      <div class="dispenser-bar"></div>
      <div class="dispenser-slot"></div>
    </div>

    <!-- The receipt paper card -->
    <main class="auth-card receipt-card">
      <div class="receipt-inner">
        <!-- Top row with header and Chaayos-style green stamp -->
        <div class="receipt-top-row">
          <div class="receipt-header-left">
            <span class="receipt-status-tag">SECURE ACCESS</span>
            <h1 class="receipt-title">TrustX Ledger</h1>
            <p class="receipt-subtitle">Digital Shop Ledger &bull; &#x20B9; INR</p>
          </div>
          <div class="receipt-stamp" title="TrustX Ledger Verified">
            <span class="receipt-stamp-brand">TrustX</span>
            <span class="receipt-stamp-sub">VERIFIED</span>
          </div>
        </div>

        <hr class="receipt-divider" />

        <!-- Receipt metadata items -->
        <div class="receipt-items">
          <div class="receipt-item-row">
            <span class="receipt-item-label">LEDGER MODE</span>
            <span class="receipt-item-val">SHOP WORKSPACE</span>
          </div>
          <div class="receipt-item-row">
            <span class="receipt-item-label">SECURITY PROTOCOL</span>
            <span class="receipt-item-val">SHOP PASSCODE</span>
          </div>
          <div class="receipt-item-row">
            <span class="receipt-item-label">TIMESTAMP</span>
            <span class="receipt-item-val" id="receiptTimeDisplay">26 SEP 2026</span>
          </div>
        </div>

        <hr class="receipt-divider" />

        <div id="authAlert" class="alert alert-error is-hidden" role="alert" style="margin-bottom:0.75rem;">
          <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
          <span data-alert-msg></span>
        </div>

        <!-- The shop code form -->
        <form id="codeForm" novalidate>
          <div class="receipt-total-box">
            <div class="receipt-total-header">
              <label for="codeInput" class="receipt-total-label">SHOP PASSCODE</label>
              <span class="receipt-total-badge">REQUIRED</span>
            </div>
            <div style="position: relative; display: flex; align-items: center; width: 100%;">
              <input class="code-input" id="codeInput" name="code" type="password" autocomplete="one-time-code" maxlength="32" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;" autocapitalize="characters" required style="padding-right: 2.75rem; width: 100%;" />
              <button type="button" id="toggleCodeVisibility" style="position: absolute; right: 0.75rem; background: none; border: none; cursor: pointer; color: #7a6b58; display: flex; align-items: center; justify-content: center; padding: 4px;" title="Show/Hide passcode" aria-label="Toggle passcode visibility">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-receipt-pay" id="codeSubmitBtn">
            <span>OPEN LEDGER</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
          </button>
        </form>

        <div class="receipt-footer-note">HAVE A NICE DAY!</div>
      </div>

      <!-- Torn bottom serration edge -->
      <div class="receipt-tear-edge" aria-hidden="true"></div>
    </main>

    <div class="auth-footer-caption">
      TrustX Ledger &bull; Fast, Offline-First Shop Record
    </div>
  </div>

  <script type="module">
    import { isConfigured, initFirebase } from "./js/firebase.js";
    import {
      initAuth,
      signInAnonymous,
      enrollBrowser,
      getAccessGrant,
      normalizeCode,
      reportError,
    } from "./js/auth.js";

    const alertBox = document.getElementById("authAlert");
    const alertMsg = alertBox.querySelector("[data-alert-msg]");
    const codeForm = document.getElementById("codeForm");
    const codeInput = document.getElementById("codeInput");
    const codeSubmitBtn = document.getElementById("codeSubmitBtn");
    const timeDisp = document.getElementById("receiptTimeDisplay");
    if (timeDisp) {
      try {
        const d = new Date();
        const day = String(d.getDate()).padStart(2, "0");
        const month = d.toLocaleString("en-US", { month: "short" }).toUpperCase();
        const year = d.getFullYear();
        timeDisp.textContent = `${day} ${month} ${year}`;
      } catch (_) {}
    }

    const toggleBtn = document.getElementById("toggleCodeVisibility");
    if (toggleBtn) {
      toggleBtn.addEventListener("click", () => {
        const isPassword = codeInput.type === "password";
        codeInput.type = isPassword ? "text" : "password";
        toggleBtn.innerHTML = isPassword
          ? `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
          : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
      });
    }

    function showAlert(message, type = "error") {
      alertBox.classList.remove("is-hidden");
      alertBox.className = "alert alert-" + type;
      alertMsg.textContent = message;
    }
    function hideAlert() {
      alertBox.classList.add("is-hidden");
    }
    function setBtnLoading(loading) {
      codeSubmitBtn.disabled = loading;
      codeSubmitBtn.classList.toggle("is-loading", loading);
    }

    function goDashboard() {
      window.location.replace("dashboard.html");
    }

    async function boot() {
      if (!isConfigured()) {
        showAlert(
          "Firebase is not configured yet. Open js/firebase.js and add your web app config, then reload.",
          "warning"
        );
        codeSubmitBtn.disabled = true;
        return;
      }

      const params = new URLSearchParams(window.location.search);
      if (params.get("reason") === "signedout") {
        showAlert("You have been signed out.", "info");
      } else if (params.get("reason") === "revoked") {
        showAlert("This browser's access was revoked. Enter the shop code to sign in again.", "info");
      } else if (params.get("reason") === "not-enrolled") {
        showAlert("This browser is not set up on this shop yet. Enter the shop code to continue.", "info");
      }

      /* A browser that is already trusted has no business on this page:
         the grant in Firestore is what the ledger actually checks, so
         send it straight through instead of making it retype the code. */
      try {
        await initAuth();
        const grant = await getAccessGrant();
        if (grant && grant.active === true) goDashboard();
      } catch (err) {
        /* Offline, or the read was denied: fall through to the form.
           The code path below re-checks everything anyway. */
        console.warn("[trustx-ledger] auto sign-in check skipped:", err);
      }
    }

    boot();

    codeForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      hideAlert();
      const code = codeInput.value;
      if (!code.trim()) {
        showAlert("Enter the shop code.");
        return;
      }
      setBtnLoading(true);
      try {
        await initFirebase();
        await signInAnonymous();
        /* The code is hashed here and never compared here: the rules in
           firestore.rules do the comparing, against a hash only the
           Admin SDK could have written. */
        await enrollBrowser({ code: normalizeCode(code) });
        goDashboard();
      } catch (err) {
        showAlert(reportError(err));
        codeInput.focus();
        codeInput.select();
        setBtnLoading(false);
      }
    });
  </script>
</body>
</html>
