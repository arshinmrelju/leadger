<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in &middot; SEVA LEDGER</title>
  <meta name="description" content="Sign in to SEVA LEDGER" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/responsive.css" />

  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js"
    }
  }
  </script>
</head>
<body class="auth-body" data-page="login">
  <main class="auth-card card">
    <img class="auth-logo" src="assets/logo.svg" alt="SEVA LEDGER logo" width="58" height="58" />
    <h1 class="auth-title">SEVA LEDGER</h1>
    <p class="auth-sub">Digital Service Shop Ledger</p>

    <div class="flex-between mb-2">
      <span class="small muted">Connection</span>
      <span class="pill pill-neutral" id="syncPill">
        <span class="dot dot-neutral"></span>
        <span data-sync-label>Checking&hellip;</span>
      </span>
    </div>

    <div id="authAlert" class="alert alert-error is-hidden" role="alert">
      <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
      <span data-alert-msg></span>
    </div>

    <!-- Google -->
    <button type="button" class="btn btn-secondary btn-block btn-lg" id="googleBtn">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.4 6.1 29.4 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.4 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C42.3 35.5 44 30 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
      Continue with Google
    </button>

    <div class="auth-divider">or</div>

    <!-- Email / password -->
    <form id="emailForm" novalidate>
      <div class="field" id="nameField" style="display:none;">
        <label for="accName">Your name</label>
        <input class="input" id="accName" name="name" type="text" autocomplete="name" placeholder="Employee name" />
      </div>
      <div class="field">
        <label for="emailInput">Email address</label>
        <input class="input" id="emailInput" name="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label for="passwordInput">Password</label>
        <input class="input" id="passwordInput" name="password" type="password" autocomplete="current-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" />
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="emailSubmitBtn">Sign in</button>
      <p class="small muted text-center mt-1" style="margin-bottom:0;">
        <button type="button" class="btn btn-ghost" id="modeToggle" style="padding:0.2rem 0.4rem;font-size:0.82rem;">New here? Create an account</button>
      </p>
    </form>

    <div class="auth-divider">or use</div>

    <!-- Shop access code -->
    <form id="codeForm" novalidate>
      <div class="field">
        <label for="codeInput">Shop access code</label>
        <input class="input code-input" id="codeInput" name="code" type="password" autocomplete="one-time-code" maxlength="32" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" />
        <span class="field-hint">Use this on the shop computer to stay signed in on the shop Wi-Fi.</span>
      </div>
      <button type="submit" class="btn btn-accent btn-block" id="codeSubmitBtn">Enter shop</button>
    </form>
  </main>

  <script type="module">
    import { isConfigured, initFirebase } from "./js/firebase.js";
    import { setSyncState } from "./js/app.js";
    import {
      initAuth,
      onAuthStateChange,
      getCurrentUser,
      signInWithGoogle,
      signInWithEmail,
      createAccount,
      joinWithAccessCode,
      resolveMembership,
      canAdmin,
      reportError,
    } from "./js/auth.js";

    const alertBox = document.getElementById("authAlert");
    const alertMsg = alertBox.querySelector("[data-alert-msg]");
    const googleBtn = document.getElementById("googleBtn");
    const emailForm = document.getElementById("emailForm");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const accName = document.getElementById("accName");
    const nameField = document.getElementById("nameField");
    const emailSubmitBtn = document.getElementById("emailSubmitBtn");
    const modeToggle = document.getElementById("modeToggle");
    const codeForm = document.getElementById("codeForm");
    const codeInput = document.getElementById("codeInput");
    const codeSubmitBtn = document.getElementById("codeSubmitBtn");

    let registerMode = false;
    let codeLoginInFlight = false;

    function showAlert(message, type = "error") {
      alertBox.classList.remove("is-hidden");
      alertBox.className = "alert alert-" + type;
      alertMsg.textContent = message;
    }
    function hideAlert() {
      alertBox.classList.add("is-hidden");
    }
    function setBtnLoading(btn, loading) {
      btn.disabled = loading;
      btn.classList.toggle("is-loading", loading);
    }
    function setFormDisabled(disabled) {
      googleBtn.disabled = disabled;
      emailForm.querySelectorAll("input, button").forEach((el) => (el.disabled = disabled));
      codeForm.querySelectorAll("input, button").forEach((el) => (el.disabled = disabled));
    }

    async function goDashboard() {
      const user = getCurrentUser();
      if (!user) return;
      try {
        const res = await resolveMembership(user);
        if (res.state === "ok" && canAdmin(res.role)) {
          window.location.replace("admin.html");
          return;
        }
      } catch (_) {
        // fall through to the dashboard; the shell shows the right shield
      }
      window.location.replace("dashboard.html");
    }

    async function boot() {
      if (!isConfigured()) {
        setSyncState("setup");
        showAlert(
          "Firebase is not configured yet. Open js/firebase.js and add your web app config, then reload.",
          "warning"
        );
        setFormDisabled(true);
        return;
      }
      setSyncState("connecting");
      initFirebase().then((fb) => fb && setSyncState("online")).catch(() => setSyncState("setup"));

      const params = new URLSearchParams(window.location.search);
      if (params.get("reason") === "signedout") {
        showAlert("You have been signed out.", "info");
      }

      try {
        await initAuth();
      } catch (err) {
        console.error("[seva-ledger] auth init failed:", err);
        showAlert(reportError(err), "warning");
        setFormDisabled(true);
        return;
      }

      onAuthStateChange((user) => {
        if (user && !(user.isAnonymous && codeLoginInFlight)) goDashboard();
      });
    }

    boot();

    googleBtn.addEventListener("click", async () => {
      hideAlert();
      setBtnLoading(googleBtn, true);
      try {
        await signInWithGoogle();
        goDashboard();
      } catch (err) {
        showAlert(reportError(err));
        setBtnLoading(googleBtn, false);
      }
    });

    modeToggle.addEventListener("click", () => {
      registerMode = !registerMode;
      hideAlert();
      nameField.style.display = registerMode ? "" : "none";
      emailSubmitBtn.textContent = registerMode ? "Create account" : "Sign in";
      modeToggle.textContent = registerMode ? "Have an account? Sign in" : "New here? Create an account";
      passwordInput.setAttribute("autocomplete", registerMode ? "new-password" : "current-password");
    });

    emailForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      hideAlert();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      if (!email || !password) {
        showAlert("Enter your email and password.");
        return;
      }
      if (password.length < 6 && registerMode) {
        showAlert("Password must be at least 6 characters.");
        return;
      }
      setBtnLoading(emailSubmitBtn, true);
      try {
        if (registerMode) {
          await createAccount(email, password, accName.value.trim());
        } else {
          await signInWithEmail(email, password);
        }
        goDashboard();
      } catch (err) {
        showAlert(reportError(err));
        setBtnLoading(emailSubmitBtn, false);
      }
    });

    codeForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      hideAlert();
      const code = codeInput.value.trim();
      if (!code) {
        showAlert("Enter the shop access code.");
        return;
      }
      setBtnLoading(codeSubmitBtn, true);
      try {
        codeLoginInFlight = true;
        await joinWithAccessCode(code);
        goDashboard();
      } catch (err) {
        showAlert(reportError(err));
      } finally {
        codeLoginInFlight = false;
        setBtnLoading(codeSubmitBtn, false);
      }
    });
  </script>
</body>
</html>
