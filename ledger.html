  <script type="module">
    import { setLoading, toast } from "./js/app.js";
    import {
      formatINR,
      formatKolkataLong,
      escapeHtml,
      todayKolkata,
      isValidDateKey,
    } from "./js/utils.js";
    import {
      fetchDayPage,
      countDayTransactions,
      fetchDayState,
      isNetworkError,
    } from "./js/ledger.js";
    import {
      shiftDateKey,
      dayHeading,
      formatEntryTime,
      filterDayRows,
      dayTotals,
      mergeDayPage,
      sortDayRows,
    } from "./js/day-ledger.js";
    import { txnActionButtons, handleTxnAction } from "./js/txn-actions.js";
    import { reportError } from "./js/auth.js";
    import { initAppShell } from "./js/shell.js";
    import { openSaleForm, onSaleRecorded } from "./js/sale-form.js";

    const mainContent = document.getElementById("mainContent");

    /* Rows pulled per read. A day is small, so the first page normally
       holds everything; the cursor exists so a busy day degrades into
       "Load more" instead of a silent truncation. */
    const PAGE_SIZE = 100;

    /* Search is client-side over the rows already in memory, so this
       only controls how long typing settles before the list redraws. */
    const SEARCH_DEBOUNCE_MS = 250;

    /* =========================================================
       State
       ========================================================= */
    let dateKey = todayKolkata();
    let lastSeenToday = dateKey;   // what "today" was at the last rollover
    let rows = [];            // every row loaded for `dateKey`
    let cursor = null;        // resume point for the next page
    let hasMore = false;
    let dayCount = 0;         // server-side count for the day
    let closed = false;       // dayHeads/{dateKey}.state === "closed"
    let loading = false;
    let loadError = null;     // kept so render() can preserve the error state

    let searchText = "";
    let filterMethod = "any";
    let filterStatus = "any";

    /* =========================================================
       Markup
       ========================================================= */

    const ICON_CHEVRON_L =
      '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>';
    const ICON_CHEVRON_R =
      '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>';
    const ICON_REFRESH =
      '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>';
    const ICON_LOCK =
      '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
    const ICON_PLUS =
      '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';

    function pageMarkup() {
      return (
        '<div class="ledger-head">' +
          "<h1>Daily ledger</h1>" +
          '<span class="ledger-sub" id="ledgerDayLabel"></span>' +
          '<div class="ledger-head-actions">' +
            '<button class="btn btn-primary" type="button" id="ledgerRecordBtn">' + ICON_PLUS + " Record sale</button>" +
          "</div>" +
        "</div>" +

        '<div class="ledger-closed is-hidden" id="ledgerClosed">' + ICON_LOCK +
          "<div><strong>This day is closed.</strong> Sales recorded on it can be read but not edited, settled or deleted.</div>" +
        "</div>" +

        '<div class="card ledger-card">' +
          '<div class="card-header">' +
            '<div class="ledger-bar">' +
              "<div>" +
                '<span class="ledger-daylabel">Business day</span>' +
                '<div class="ledger-datenav">' +
                  '<button class="btn btn-secondary btn-icon" type="button" id="ledgerPrev" aria-label="Previous day" title="Previous day">' + ICON_CHEVRON_L + "</button>" +
                  '<input class="input" id="ledgerDate" type="date" aria-label="Business day" />' +
                  '<button class="btn btn-secondary btn-icon" type="button" id="ledgerNext" aria-label="Next day" title="Next day">' + ICON_CHEVRON_R + "</button>" +
                  '<button class="btn btn-secondary" type="button" id="ledgerToday">Today</button>' +
                "</div>" +
              "</div>" +

              '<div class="field field-search">' +
                '<label for="ledgerSearch">Search</label>' +
                '<input class="input" id="ledgerSearch" type="search" placeholder="Service or customer" autocomplete="off" />' +
              "</div>" +

              '<div class="field field-method">' +
                '<label for="ledgerMethod">Payment</label>' +
                '<select class="input" id="ledgerMethod">' +
                  '<option value="any">All methods</option>' +
                  '<option value="cash">Cash</option>' +
                  '<option value="upi">UPI</option>' +
                  '<option value="card">Card</option>' +
                  '<option value="due">Due</option>' +
                "</select>" +
              "</div>" +

              '<div class="field field-status">' +
                '<label for="ledgerStatus">Status</label>' +
                '<select class="input" id="ledgerStatus">' +
                  '<option value="any">All statuses</option>' +
                  '<option value="paid">Paid</option>' +
                  '<option value="pending">Pending</option>' +
                "</select>" +
              "</div>" +

              '<div class="ledger-actions">' +
                '<button class="btn btn-secondary" type="button" id="ledgerRefresh">' + ICON_REFRESH + " Refresh</button>" +
              "</div>" +
            "</div>" +
          "</div>" +

          '<div class="card-body-flush">' +
            '<div class="table-wrap"><table class="table ledger-table">' +
              "<thead><tr>" +
                "<th>Time</th><th>Service</th>" +
                '<th class="ledger-num">Quantity</th>' +
                '<th class="ledger-num">Rate</th>' +
                '<th class="ledger-num">Total</th>' +
                "<th>Payment</th><th>Customer</th><th>Status</th>" +
                '<th class="txn-actions-col"><span class="muted">Actions</span></th>' +
              "</tr></thead>" +
              '<tbody id="ledgerBody"></tbody>' +
            "</table></div>" +
            '<div class="ledger-totals" id="ledgerTotals"></div>' +
            '<div class="ledger-more is-hidden" id="ledgerMore">' +
              '<span class="muted" id="ledgerMoreText"></span>' +
              '<button class="btn btn-secondary btn-sm" type="button" id="ledgerLoadMore">Load more</button>' +
            "</div>" +
          "</div>" +
        "</div>"
      );
    }

    function totalCell(label, value, cls) {
      return (
        '<div class="ledger-total-cell ' + (cls || "") + '">' +
          '<span class="lt-label">' + label + "</span>" +
          '<span class="lt-value">' + value + "</span>" +
        "</div>"
      );
    }

    function stateRow(icon, title, body, extra) {
      return (
        '<tr><td colspan="9"><div class="state ' + (extra || "") + '">' +
          (icon || "") +
          "<h3>" + title + "</h3>" +
          (body ? "<p>" + body + "</p>" : "") +
        "</div></td></tr>"
      );
    }

    /* =========================================================
       Rendering
       ========================================================= */

    function render() {
      const body = document.getElementById("ledgerBody");
      const totals = document.getElementById("ledgerTotals");
      const more = document.getElementById("ledgerMore");
      const label = document.getElementById("ledgerDayLabel");
      const dateInput = document.getElementById("ledgerDate");
      const closedBox = document.getElementById("ledgerClosed");
      if (!body || !totals) return;

      if (dateInput && dateInput.value !== dateKey) dateInput.value = dateKey;
      if (label) {
        label.textContent =
          dayHeading(dateKey) + (dateKey === todayKolkata() ? " (today)" : "");
      }
      if (closedBox) closedBox.classList.toggle("is-hidden", !closed);

      /* Totals describe the whole day, not the current filter, so the
         shop can always see the day's real takings. The count comes
         from a server aggregate rather than the loaded row count. */
      const t = dayTotals(rows);
      totals.innerHTML =
        totalCell("Transactions", String(dayCount || t.count), "lt-count") +
        totalCell("Revenue", formatINR(t.revenuePaise), "lt-primary") +
        totalCell("Cash", formatINR(t.cashPaise)) +
        totalCell("UPI", formatINR(t.upiPaise)) +
        totalCell("Card", formatINR(t.cardPaise)) +
        totalCell("Due", formatINR(t.duePaise), "lt-due");

      if (more) {
        more.classList.toggle("is-hidden", !hasMore);
        const text = document.getElementById("ledgerMoreText");
        if (text) {
          text.textContent = "Showing " + rows.length + " of " + (dayCount || rows.length);
        }
      }

      if (loading && !rows.length) {
        body.innerHTML =
          '<tr><td colspan="9"><div class="state state-table-loading">' +
          '<div class="state-loading-badge"><span class="spinner spinner-sm"></span>' +
          '<span>Loading the day<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span></span></div>' +
          '</div></td></tr>';
        return;
      }

      /* render() also runs from the loader's finally block, so the
         failure has to be re-asserted here or it would be replaced by
         the empty state a moment after it was drawn. */
      if (loadError) {
        renderError(loadError);
        return;
      }

      const visible = sortDayRows(
        filterDayRows(rows, { query: searchText, method: filterMethod, status: filterStatus })
      );

      if (!visible.length) {
        const filtering = searchText.trim() || filterMethod !== "any" || filterStatus !== "any";
        if (!rows.length) {
          body.innerHTML = stateRow(
            ICON_PLUS,
            "No transactions for this date.",
            closed
              ? "This day is closed and has no sales on record."
              : "Nothing was recorded on " + escapeHtml(dayHeading(dateKey)) + "."
          );
        } else if (filtering) {
          body.innerHTML = stateRow(
            "",
            "No matching transactions.",
            "Nothing on this day matches your search and filters."
          );
        } else {
          body.innerHTML = stateRow("", "No transactions for this date.", "");
        }
        return;
      }

      body.innerHTML = visible.map(rowMarkup).join("");
    }

    function rowMarkup(t) {
      const actions = txnActionButtons(t, { closed });

      return (
        "<tr>" +
          '<td class="ledger-time" data-label="Time">' + escapeHtml(formatEntryTime(t.createdAt)) + "</td>" +
          '<td class="ledger-service" data-label="Service">' + escapeHtml(t.serviceName) + "</td>" +
          '<td class="ledger-num" data-label="Quantity">' + escapeHtml(String(t.quantity)) + "</td>" +
          '<td class="ledger-num" data-label="Rate">' + formatINR(t.ratePaise) + "</td>" +
          '<td class="ledger-num ledger-total" data-label="Total">' + formatINR(t.totalPaise) + "</td>" +
          '<td data-label="Payment"><span class="ledger-method method-' + escapeHtml(t.paymentMethod) + '">' + escapeHtml(t.methodLabel) + "</span></td>" +
          '<td class="ledger-customer" data-label="Customer">' + (t.customerName ? escapeHtml(t.customerName) : "—") + "</td>" +
          '<td data-label="Status">' + statusBadge(t) + "</td>" +
          '<td class="txn-actions-col"><div class="txn-row-actions">' + actions + "</div></td>" +
        "</tr>"
      );
    }

    function statusBadge(t) {
      if (t.paymentMethod === "due" && t.status === "pending") {
        return '<span class="badge badge-warning">Unpaid</span>';
      }
      return '<span class="badge badge-success">Paid</span>';
    }

    /* =========================================================
       Data
       ========================================================= */

    async function reload() {
      if (loading) return;
      loading = true;
      loadError = null;
      const requested = dateKey;
      render();

      try {
        /* The rows and the day state are the essential reads. */
        const [page, state] = await Promise.all([
          fetchDayPage({ dateKey: requested, pageSize: PAGE_SIZE }),
          fetchDayState(requested),
        ]);
        rows = page.rows;
        cursor = page.cursor;
        hasMore = page.hasMore;
        closed = state.closed;
      } catch (err) {
        console.error("[trustx-ledger] ledger load:", err);
        rows = [];
        cursor = null;
        hasMore = false;
        dayCount = 0;
        loadError = err;
        toast(reportError(err), "error");
        loading = false;
        render();
        return;
      }

      loading = false;
      render();

      /* The day's true count is a nicety, fetched on its own so a failure
         never takes the day's rows off the screen. It is normally the day
         head's own counter, which is cached and works offline. The date
         is re-checked on the way back so a slow read cannot land on top
         of a day the user has already navigated away from. */
      try {
        const count = await countDayTransactions(requested);
        if (dateKey === requested) {
          dayCount = count;
          render();
        }
      } catch (err) {
        console.warn("[trustx-ledger] ledger count unavailable:", err);
      }
    }

    function renderError(err) {
      const body = document.getElementById("ledgerBody");
      if (!body) return;
      body.innerHTML = stateRow(
        ICON_LOCK,
        "Could not load this day",
        isNetworkError(err)
          ? "You appear to be offline. Showing nothing until the connection returns."
          : escapeHtml(reportError(err)),
        "is-error"
      );
    }

    async function loadMore() {
      if (loading || !hasMore || !cursor) return;
      loading = true;
      const btn = document.getElementById("ledgerLoadMore");
      if (btn) setLoading(btn, true);
      try {
        const page = await fetchDayPage({ dateKey, pageSize: PAGE_SIZE, cursor });
        rows = mergeDayPage(rows, page.rows);
        cursor = page.cursor;
        hasMore = page.hasMore;
      } catch (err) {
        console.error("[trustx-ledger] ledger page:", err);
        toast(reportError(err), "error");
      } finally {
        loading = false;
        if (btn) setLoading(btn, false);
        render();
      }
    }

    /* =========================================================
       Row actions
       ========================================================= */

    /* The buttons, the dialog and the confirmations all live in
       js/txn-actions.js, shared with the history page; this only hands
       over the day's rows and says how to redraw afterwards. */
    function onTableClick(event) {
      handleTxnAction(event, {
        rows,
        isClosed: () => closed,
        onChange: ({ action, row }) => {
          if (action === "delete") {
            rows = rows.filter((r) => r.txnId !== row.txnId);
            dayCount = Math.max(0, dayCount - 1);
          }
          render();
        },
      });
    }

    /* =========================================================
       Boot
       ========================================================= */

    async function renderPage() {
      document.getElementById("topbarDate").textContent = formatKolkataLong(new Date());
      mainContent.innerHTML = pageMarkup();

      const dateInput = document.getElementById("ledgerDate");
      dateInput.value = dateKey;
      dateInput.addEventListener("change", () => {
        if (!isValidDateKey(dateInput.value)) return;
        goToDate(dateInput.value);
      });

      document.getElementById("ledgerPrev").addEventListener("click", () => {
        goToDate(shiftDateKey(dateKey, -1));
      });
      document.getElementById("ledgerNext").addEventListener("click", () => {
        goToDate(shiftDateKey(dateKey, 1));
      });
      document.getElementById("ledgerToday").addEventListener("click", () => {
        goToDate(todayKolkata());
      });
      document.getElementById("ledgerRefresh").addEventListener("click", () => reload());
      document.getElementById("ledgerLoadMore").addEventListener("click", () => loadMore());
      document.getElementById("ledgerRecordBtn").addEventListener("click", () => openSaleForm());
      document.getElementById("ledgerBody").addEventListener("click", onTableClick);

      document.getElementById("ledgerMethod").addEventListener("change", (e) => {
        filterMethod = e.target.value;
        render();
      });
      document.getElementById("ledgerStatus").addEventListener("change", (e) => {
        filterStatus = e.target.value;
        render();
      });

      /* Debounced so a burst of keystrokes redraws the list once. */
      const search = document.getElementById("ledgerSearch");
      let timer = null;
      search.addEventListener("input", () => {
        clearTimeout(timer);
        timer = setTimeout(() => {
          searchText = search.value;
          render();
        }, SEARCH_DEBOUNCE_MS);
      });

      await reload();
    }

    /** Move to another business day, discarding the current page. */
    function goToDate(next) {
      if (!isValidDateKey(next) || next === dateKey) return;
      dateKey = next;
      rows = [];
      cursor = null;
      hasMore = false;
      dayCount = 0;
      closed = false;
      loadError = null;
      searchText = "";
      const search = document.getElementById("ledgerSearch");
      if (search) search.value = "";
      reload();
    }

    initAppShell({
      onReady: renderPage,
      onDayChange: () => {
        /* The header rolls over at midnight Kolkata. If the ledger is
           parked on today, follow it; a day the user deliberately
           picked stays put. */
        if (dateKey === lastSeenToday) {
          const next = todayKolkata();
          if (next !== dateKey) goToDate(next);
        }
        lastSeenToday = todayKolkata();
      },
    });

    /* A sale recorded in the dialog belongs to today; jump there if the
       ledger is parked on another day, otherwise refresh in place. */
    onSaleRecorded(({ dateKey: saleDate } = {}) => {
      if (saleDate && saleDate !== dateKey) goToDate(saleDate);
      else reload();
    });
  </script>
</body>
</html>
