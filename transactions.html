<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transaction history &middot; SEVA LEDGER</title>
  <meta name="description" content="Full transaction history for SEVA LEDGER" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/transactions.css" />
  <link rel="stylesheet" href="css/responsive.css" />

  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js"
    }
  }
  </script>
</head>
<body data-page="transactions">
  <div class="app">
    <!-- ===================== Sidebar ===================== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img class="brand-logo" src="assets/logo.svg" alt="" width="38" height="38" />
        <div class="brand-text">
          <div class="brand-name">SEVA LEDGER</div>
          <div class="brand-sub">Shop ledger</div>
        </div>
      </div>

      <nav class="sidebar-nav" aria-label="Main navigation">
        <div class="nav-section-title">Workspace</div>

        <a class="nav-link" data-nav="dashboard" href="dashboard.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
          Dashboard
        </a>

        <a class="nav-link is-active" data-nav="transactions" href="transactions.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17h10"/><path d="M4 5h16v14H4z"/><path d="M4 5l2-2h12l2 2"/></svg>
          Transactions
        </a>

        <button class="nav-link" type="button" data-coming>
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="M4 8h16"/><path d="M8 12h8"/><path d="M8 16h5"/></svg>
          Daily Ledger
          <span class="nav-badge">Soon</span>
        </button>

        <button class="nav-link" type="button" data-coming>
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Customers
          <span class="nav-badge">Soon</span>
        </button>

        <button class="nav-link" type="button" data-coming>
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1v22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          Expenses
          <span class="nav-badge">Soon</span>
        </button>

        <button class="nav-link" type="button" data-coming>
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-6 4 3 5-7"/></svg>
          Reports
          <span class="nav-badge">Soon</span>
        </button>

        <div class="nav-section-title">Management</div>

        <a class="nav-link" data-nav="admin" href="admin.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1v22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          Admin
        </a>
      </nav>

      <div class="sidebar-footer">
        <div id="userChip"></div>
        <div class="sidebar-footer-meta" style="margin-top:0.5rem;font-size:0.72rem;opacity:0.8;">
          SEVA LEDGER &middot; v0.8.0
        </div>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- ===================== Main ===================== -->
    <div class="main">
      <header class="topbar">
        <button class="topbar-hamburger" type="button" data-sidebar-toggle aria-label="Toggle navigation">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="topbar-title">Transactions</div>
        <span class="pill pill-neutral" id="topbarShop" style="display:none;"></span>
        <span class="pill pill-neutral" id="topbarDate" aria-live="off"></span>
      </header>

      <main class="content" id="mainContent">
        <!-- Rendered by transactions JS (app shell). -->
        <div class="state">
          <span class="spinner" aria-hidden="true"></span>
          <p class="muted">Loading&hellip;</p>
        </div>
      </main>
    </div>
  </div>

  <script type="module">
    import { setLoading } from "./js/app.js";
    import {
      formatINR,
      formatDateKey,
      formatKolkataLong,
      formatKolkataTime,
      escapeHtml,
      todayKolkata,
      kolkataDateKey,
      isValidDateKey,
      isPaymentMethod,
    } from "./js/utils.js";
    import { fetchTransactions, isNetworkError } from "./js/ledger.js";
    import { reportError } from "./js/auth.js";
    import { initAppShell } from "./js/shell.js";
    import { openSaleForm, onSaleRecorded } from "./js/sale-form.js";

    const mainContent = document.getElementById("mainContent");

    const ICON_PLUS =
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';

    /* How many rows to pull per read. "All time" is a single ordered
       query, so this is the window over the whole ledger. */
    const LIMIT = 500;

    /* =========================================================
       Filter state
       ========================================================= */
    let scope = "all";                 // "all" | "day"
    let dateKey = todayKolkata();
    let query = "";
    let method = "";
    let lastRows = [];                 // last server read, re-filtered on the client

    function statBlock(label, valueId, className) {
      return (
        '<div class="stat-card ' + (className || "") + '">' +
        '<div class="stat-label">' + label + "</div>" +
        '<div class="stat-value" id="' + valueId + '">' + formatINR(0) + "</div>" +
        "</div>"
      );
    }

    /* =========================================================
       Render the page body (runs once the shell approves access)
       ========================================================= */
    async function renderPage() {
      document.getElementById("topbarDate").textContent = formatKolkataLong(new Date());

      mainContent.innerHTML =
        '<div class="dash-head">' +
        "<div>" +
        "<h1>Transaction history</h1>" +
        '<p class="small muted" id="histSub">Every sale recorded in this ledger, newest first.</p>' +
        "</div>" +
        '<button type="button" class="btn btn-primary btn-lg" id="newTxnBtn">' +
        ICON_PLUS +
        "New transaction</button>" +
        "</div>" +

        /* Totals for whatever the filters currently match. */
        '<div class="dash-grid">' +
        statBlock("Transactions", "histCount") +
        statBlock("Total billed", "histTotal") +
        statBlock("Collected", "histPaid", "stat-cash") +
        statBlock("Outstanding", "histDue", "stat-due") +
        "</div>" +

        '<section class="card" aria-label="Transaction history">' +
        '<div class="card-body">' +
        '<div class="hist-bar">' +
        '<div class="field field-search">' +
        '<label for="histSearch">Search</label>' +
        '<input class="input" id="histSearch" type="search" autocomplete="off" placeholder="Customer or service" />' +
        "</div>" +
        '<div class="field field-date">' +
        '<label for="histDate">Day</label>' +
        '<input class="input" id="histDate" type="date" value="' + escapeHtml(dateKey) + '" />' +
        "</div>" +
        '<div class="field field-method">' +
        '<label for="histMethod">Payment</label>' +
        '<select class="select" id="histMethod">' +
        '<option value="">All methods</option>' +
        '<option value="cash">Cash</option>' +
        '<option value="upi">UPI</option>' +
        '<option value="card">Card</option>' +
        '<option value="due">Due</option>' +
        "</select></div>" +
        '<div class="hist-actions">' +
        '<button type="button" class="btn btn-secondary" id="histTodayBtn">Today</button>' +
        '<button type="button" class="btn btn-secondary" id="histAllBtn">All time</button>' +
        '<button type="button" class="btn btn-secondary" id="histResetBtn">Clear</button>' +
        '<button type="button" class="btn btn-primary" id="histRefreshBtn">Refresh</button>' +
        "</div>" +
        "</div>" +
        "</div>" +

        '<div class="table-wrap"><table class="table txn-table hist-table">' +
        "<thead><tr>" +
        "<th>Time</th><th>Customer</th><th>Service</th>" +
        '<th class="text-right">Qty</th><th class="text-right">Rate</th>' +
        "<th>Payment</th>" +
        '<th class="text-right">Amount</th><th class="text-right">Paid</th><th class="text-right">Due</th>' +
        "</tr></thead>" +
        '<tbody id="histBody">' +
        '<tr><td colspan="9"><div class="state"><span class="spinner" aria-hidden="true"></span>' +
        "<p class=\"muted\">Loading the ledger&hellip;</p></div></td></tr>" +
        "</tbody></table></div>" +
        '<div class="txn-footer small muted" id="histFooter">&nbsp;</div>' +
        "</section>";

      wire();
      await reload();
    }

    /* =========================================================
       Wiring
       ========================================================= */
    function wire() {
      document.getElementById("newTxnBtn").addEventListener("click", () => openSaleForm());

      const search = document.getElementById("histSearch");
      search.addEventListener("input", () => {
        query = search.value.trim().toLowerCase();
        /* Filtering is client-side over the loaded window, so re-render
           from cache instead of re-querying on every keystroke. */
        renderHistory(lastRows);
      });

      document.getElementById("histDate").addEventListener("change", (e) => {
        const value = e.target.value;
        if (isValidDateKey(value)) {
          dateKey = value;
          scope = "day";
          syncScopeButtons();
          reload();
        } else {
          e.target.value = dateKey;
        }
      });

      document.getElementById("histMethod").addEventListener("change", (e) => {
        const value = e.target.value;
        method = isPaymentMethod(value) ? value : "";
        e.target.value = method;
        renderHistory(lastRows);
      });

      document.getElementById("histTodayBtn").addEventListener("click", () => {
        scope = "day";
        dateKey = todayKolkata();
        document.getElementById("histDate").value = dateKey;
        syncScopeButtons();
        reload();
      });

      document.getElementById("histAllBtn").addEventListener("click", () => {
        scope = "all";
        syncScopeButtons();
        reload();
      });

      document.getElementById("histResetBtn").addEventListener("click", () => {
        scope = "all";
        query = "";
        method = "";
        document.getElementById("histSearch").value = "";
        document.getElementById("histMethod").value = "";
        syncScopeButtons();
        reload();
      });

      document.getElementById("histRefreshBtn").addEventListener("click", () => {
        const btn = document.getElementById("histRefreshBtn");
        setLoading(btn, true);
        reload().finally(() => setLoading(btn, false));
      });
    }

    function syncScopeButtons() {
      document.getElementById("histTodayBtn").className =
        "btn " + (scope === "day" ? "btn-primary" : "btn-secondary");
      document.getElementById("histAllBtn").className =
        "btn " + (scope === "all" ? "btn-primary" : "btn-secondary");
    }

    /* =========================================================
       Data
       ========================================================= */

    async function reload() {
      const body = document.getElementById("histBody");
      const footer = document.getElementById("histFooter");
      if (!body) return;

      const dateFilter = scope === "day" ? dateKey : null;
      try {
        lastRows = await fetchTransactions({ dateKey: dateFilter, limit: LIMIT });
        renderHistory(lastRows);
      } catch (err) {
        console.error("[seva-ledger] history load:", err);
        lastRows = [];
        renderTotals([]);
        body.innerHTML =
          '<tr><td colspan="9"><div class="state is-error">' +
          '<svg class="state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>' +
          "<h3>Could not load the history</h3>" +
          "<p>" +
          escapeHtml(
            isNetworkError(err)
              ? "You appear to be offline. Entries will sync automatically when you reconnect."
              : reportError(err)
          ) +
          "</p>" +
          '<button type="button" class="btn btn-secondary" onclick="window.location.reload()">Retry</button>' +
          "</div></td></tr>";
        if (footer) footer.innerHTML = "&nbsp;";
      }
    }

    /* ---------- Client-side narrowing + rendering ---------- */

    function matches(t) {
      if (method && t.paymentMethod !== method) return false;
      if (!query) return true;
      return (
        String(t.customerName || "").toLowerCase().includes(query) ||
        String(t.serviceName || "").toLowerCase().includes(query)
      );
    }

    function totalsOf(rows) {
      return rows.reduce(
        (acc, t) => {
          acc.total += t.totalPaise;
          acc.paid += t.collectedPaise;
          acc.due += t.duePaise;
          return acc;
        },
        { total: 0, paid: 0, due: 0 }
      );
    }

    function renderTotals(rows) {
      const s = totalsOf(rows);
      const set = (id, value) => {
        const el = document.getElementById(id);
        if (el) el.textContent = value;
      };
      set("histCount", String(rows.length));
      set("histTotal", formatINR(s.total));
      set("histPaid", formatINR(s.paid));
      set("histDue", formatINR(s.due));
      const dueEl = document.getElementById("histDue");
      if (dueEl) dueEl.classList.toggle("text-danger", s.due > 0);
    }

    function methodChips(t) {
      return (
        '<span class="badge badge-method badge-' + escapeHtml(t.paymentMethod) + '">' +
        escapeHtml(t.methodLabel) +
        (t.status === "pending" ? ' <span class="badge badge-warning" style="margin-left:2px;">Pending</span>' : "") +
        "</span>"
      );
    }

    function txnRow(t) {
      const customer = t.customerName || "Walk-in";
      const qtyInfo = t.quantity > 1 ? " &times; " + String(t.quantity) : "";
      return (
        "<tr>" +
        '<td class="txn-time">' + escapeHtml(formatKolkataTime(t.createdAt)) + "</td>" +
        '<td class="txn-customer"><div class="txn-clip">' + escapeHtml(customer) + "</div></td>" +
        '<td class="txn-service"><div class="txn-clip">' + escapeHtml(t.serviceName) + qtyInfo + "</div></td>" +
        '<td class="text-right txn-num">' + escapeHtml(String(t.quantity)) + "</td>" +
        '<td class="text-right txn-num">' + formatINR(t.ratePaise) + "</td>" +
        "<td>" + methodChips(t) + "</td>" +
        '<td class="text-right txn-num">' + formatINR(t.totalPaise) + "</td>" +
        '<td class="text-right txn-num">' + formatINR(t.collectedPaise) + "</td>" +
        '<td class="text-right txn-num">' +
        (t.duePaise > 0 ? '<span class="text-danger">' + formatINR(t.duePaise) + "</span>" : '<span class="muted">' + formatINR(0) + "</span>") +
        "</td>" +
        "</tr>"
      );
    }

    /* Rows arrive newest-first, so each day's block is already in order. */
    function groupByDay(rows) {
      const groups = [];
      let current = null;
      for (const t of rows) {
        const key = t.dateKey || "";
        if (!current || current.dateKey !== key) {
          current = { dateKey: key, rows: [] };
          groups.push(current);
        }
        current.rows.push(t);
      }
      return groups;
    }

    function dayLabel(key) {
      const today = todayKolkata();
      if (key === today) return "Today \u00B7 " + formatDateKey(key);
      /* Subtract a fixed 24h so the comparison stays in the shop's
         timezone rather than the browser's local calendar. */
      if (key === kolkataDateKey(new Date(Date.now() - 86400000))) {
        return "Yesterday \u00B7 " + formatDateKey(key);
      }
      return formatDateKey(key);
    }

    function renderHistory(rows) {
      const body = document.getElementById("histBody");
      const footer = document.getElementById("histFooter");
      const sub = document.getElementById("histSub");
      if (!body || !footer) return;

      const filtered = (rows || []).filter(matches);
      renderTotals(filtered);

      if (sub) {
        sub.textContent =
          scope === "day"
            ? "Sales recorded on " + formatDateKey(dateKey) + "."
            : "Every sale recorded in this ledger, newest first.";
      }

      if (!filtered.length) {
        body.innerHTML =
          '<tr><td colspan="9"><div class="state">' +
          '<svg class="state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M9 7h6M9 11h6M9 15h3"/></svg>' +
          "<h3>" + (rows && rows.length ? "Nothing matches these filters" : "No transactions yet") + "</h3>" +
          "<p>" +
          (rows && rows.length
            ? "Try a different day, payment method or search term."
            : "Sales you record will appear here, grouped by day.") +
          "</p>" +
          (rows && rows.length
            ? ""
            : '<button type="button" class="btn btn-primary" id="histEmptyBtn">' + ICON_PLUS + "Record a sale</button>") +
          "</div></td></tr>";
        const emptyBtn = document.getElementById("histEmptyBtn");
        if (emptyBtn) emptyBtn.addEventListener("click", () => openSaleForm());
        footer.innerHTML = "&nbsp;";
        return;
      }

      const groups = groupByDay(filtered);
      const grand = totalsOf(filtered);

      body.innerHTML =
        groups
          .map((g) => {
            const s = totalsOf(g.rows);
            return (
              '<tr class="txn-group"><td colspan="9">' +
              '<div class="hist-day">' + escapeHtml(dayLabel(g.dateKey)) + "</div>" +
              '<div class="hist-day-totals">' +
              "<span>" + g.rows.length + (g.rows.length === 1 ? " sale" : " sales") + "</span>" +
              "<span>Total <b>" + formatINR(s.total) + "</b></span>" +
              "<span>Collected <b>" + formatINR(s.paid) + "</b></span>" +
              (s.due > 0 ? "<span>Due <b>" + formatINR(s.due) + "</b></span>" : "") +
              "</div></td></tr>" +
              g.rows.map(txnRow).join("")
            );
          })
          .join("") +
        '<tr class="table-total"><td colspan="6"><strong>Total (' + filtered.length + ")</strong></td>" +
        '<td class="text-right txn-num"><strong>' + formatINR(grand.total) + "</strong></td>" +
        '<td class="text-right txn-num"><strong>' + formatINR(grand.paid) + "</strong></td>" +
        '<td class="text-right txn-num"><strong>' + formatINR(grand.due) + "</strong></td></tr>";

      const scopeText = scope === "day" ? formatDateKey(dateKey) : "all time";
      const capped = rows.length >= LIMIT;
      footer.innerHTML =
        "<strong>" +
        (filtered.length === 1 ? "1 transaction" : filtered.length + " transactions") +
        "</strong> &middot; " +
        scopeText +
        (capped ? " &middot; showing the " + LIMIT + " most recent" : "");
    }

    /* =========================================================
       Boot
       ========================================================= */
    initAppShell({
      page: "transactions",
      onReady: renderPage,
      onDayChange: () => {
        /* Keep a pinned day in sync with the rollover; "all time" needs no reload. */
        if (scope === "day") {
          dateKey = todayKolkata();
          const input = document.getElementById("histDate");
          if (input) input.value = dateKey;
          reload();
        }
      },
    });

    /* A sale saved in the dialog lands in today's history immediately. */
    onSaleRecorded(() => {
      if (scope === "all") reload();
      else renderHistory(lastRows);
    });
  </script>
</body>
</html>
