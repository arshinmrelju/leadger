<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New transaction &middot; SEVA LEDGER</title>
  <meta name="description" content="Record a sale in SEVA LEDGER" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/transactions.css" />
  <link rel="stylesheet" href="css/responsive.css" />

  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js"
    }
  }
  </script>
</head>
<body data-page="transactions">
  <div class="app">
    <!-- ===================== Sidebar ===================== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img class="brand-logo" src="assets/logo.svg" alt="" width="38" height="38" />
        <div class="brand-text">
          <div class="brand-name">SEVA LEDGER</div>
          <div class="brand-sub">Shop ledger</div>
        </div>
      </div>

      <nav class="sidebar-nav" aria-label="Main navigation">
        <div class="nav-section-title">Workspace</div>

        <a class="nav-link" data-nav="dashboard" href="dashboard.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
          Dashboard
        </a>

        <a class="nav-link is-active" data-nav="transactions" href="transactions.html">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17h10"/><path d="M4 5h16v14H4z"/><path d="M4 5l2-2h12l2 2"/></svg>
          Transactions
        </a>

        <button class="nav-link" type="button" data-coming>
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="M4 8h16"/><path d="M8 12h8"/><path d="M8 16h5"/></svg>
          Daily Ledger
          <span class="nav-badge">Soon</span>
        </button>

        <button class="nav-link" type="button" data-coming>
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Customers
          <span class="nav-badge">Soon</span>
        </button>

        <button class="nav-link" type="button" data-coming>
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1v22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          Expenses
          <span class="nav-badge">Soon</span>
        </button>

        <button class="nav-link" type="button" data-coming>
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-6 4 3 5-7"/></svg>
          Reports
          <span class="nav-badge">Soon</span>
        </button>

        <div class="nav-section-title">Management</div>

        <button class="nav-link" type="button" data-coming>
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Settings
          <span class="nav-badge">Soon</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div id="userChip"></div>
        <div class="sidebar-footer-meta" style="margin-top:0.5rem;font-size:0.72rem;opacity:0.8;">
          SEVA LEDGER &middot; v0.4.0
        </div>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- ===================== Main ===================== -->
    <div class="main">
      <header class="topbar">
        <button class="topbar-hamburger" type="button" data-sidebar-toggle aria-label="Toggle navigation">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="topbar-title">Transactions</div>
        <span class="pill pill-neutral" id="topbarShop" style="display:none;"></span>
        <span class="pill pill-neutral" id="topbarDate" aria-live="off"></span>
        <span class="pill pill-neutral" id="syncPill">
          <span class="dot dot-neutral"></span>
          <span data-sync-label>Checking&hellip;</span>
        </span>
      </header>

      <main class="content" id="mainContent">
        <!-- Rendered by transactions JS (app shell). -->
        <div class="state">
          <span class="spinner" aria-hidden="true"></span>
          <p class="muted">Loading&hellip;</p>
        </div>
      </main>
    </div>
  </div>

  <script type="module">
    import { toast, setLoading, setSyncState } from "./js/app.js";
    import {
      formatINR,
      paiseToInput,
      formatKolkataLong,
      formatKolkataTime,
      escapeHtml,
      todayKolkata,
      sanitizeQuantity,
      rateToPaise,
      computeTotalPaise,
      isPaymentMethod,
      methodLabel,
    } from "./js/utils.js";
    import {
      fetchTodaySummary,
      fetchServices,
      createService,
      createTransaction,
      flushPendingWrites,
      isNetworkError,
    } from "./js/ledger.js";
    import { reportError } from "./js/auth.js";
    import { initAppShell } from "./js/shell.js";

    const mainContent = document.getElementById("mainContent");

    const ICON_PLUS =
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';

    let services = [];
    let selectedService = null;
    let paymentMethod = "cash";
    let saving = false;
    let waitingSync = false;

    /* =========================================================
       Render the page body (runs once the shell approves access)
       ========================================================= */
    async function renderPage() {
      const day = formatKolkataLong(new Date()) + " &middot; Asia/Kolkata";
      mainContent.innerHTML =
        '<section aria-label="New transaction">' +
        "<div class=\"dash-head\"><div><h1>New transaction</h1>" +
        '<p class="small muted">' + day + "</p></div>" +
        '<a class="btn btn-secondary" href="dashboard.html">Back to dashboard</a></div>' +
        '<div class="txn-wrap">' +
        "<!-- Form -->" +
        '<section class="card" aria-label="Record a sale">' +
        '<div class="card-header"><h3>Record a sale</h3></div>' +
        '<div class="card-body">' +
        '<form id="txnForm" novalidate>' +
        '<div class="alert alert-error is-hidden" id="formMsg" role="alert"><span data-form-msg></span></div>' +

        '<div class="field">' +
        '<div class="flex-between mb-1"><label for="serviceSelect" style="margin:0;">Service *</label>' +
        '<button type="button" class="btn btn-ghost btn-sm" id="addServiceToggle">' + ICON_PLUS + " Add service</button></div>" +
        '<select class="select" id="serviceSelect" required></select>' +
        '<span class="field-hint">Picks the default rate. You can override it below.</span>' +
        "</div>" +

        '<div class="field is-hidden" id="addServiceBox">' +
        '<div class="card" style="background:var(--color-bg);box-shadow:none;">' +
        '<div class="card-body" style="padding:0.85rem 1rem;">' +
        '<div class="small muted mb-1" style="font-weight:700;text-transform:uppercase;letter-spacing:.06em;">Add a service</div>' +
        '<div class="form-row">' +
        '<div class="field" style="margin:0;"><label for="newServiceName">Service name</label>' +
        '<input class="input" id="newServiceName" type="text" maxlength="80" placeholder="e.g. Passport" /></div>' +
        '<div class="field" style="margin:0;"><label for="newServiceRate">Rate (&#x20B9;)</label>' +
        '<input class="input" id="newServiceRate" type="text" inputmode="decimal" placeholder="e.g. 150" /></div>' +
        "</div>" +
        '<div class="flex" style="justify-content:flex-end;gap:0.5rem;margin-top:0.75rem;">' +
        '<button type="button" class="btn btn-secondary btn-sm" id="addServiceCancel">Cancel</button>' +
        '<button type="button" class="btn btn-primary btn-sm" id="addServiceSave">Add service</button>' +
        "</div></div></div></div>" +

        '<div class="form-row">' +
        '<div class="field"><label for="qtyInput">Quantity</label>' +
        '<input class="input" id="qtyInput" type="number" inputmode="numeric" min="1" max="100000" step="1" value="1" placeholder="1" /></div>' +
        '<div class="field"><label for="rateInput">Rate (&#x20B9;)</label>' +
        '<input class="input" id="rateInput" type="text" inputmode="decimal" value="" placeholder="0.00" /></div>' +
        "</div>" +

        '<div class="field">' +
        '<label>Payment method</label>' +
        '<div class="seg-row" id="methodRow" role="group" aria-label="Payment method">' +
        '<button type="button" class="seg-btn seg-cash is-active" data-method="cash">Cash</button>' +
        '<button type="button" class="seg-btn seg-upi" data-method="upi">UPI</button>' +
        '<button type="button" class="seg-btn seg-card" data-method="card">Card</button>' +
        '<button type="button" class="seg-btn seg-due" data-method="due">Due</button>' +
        "</div>" +
        "<span class=\"field-hint\" id=\"methodHint\">Recorded as paid.</span>" +
        "</div>" +

        '<div class="field"><label for="customerInput">Customer <span class="small muted">(optional)</span></label>' +
        '<input class="input" id="customerInput" type="text" maxlength="120" autocomplete="off" placeholder="Customer name" /></div>' +

        '<div class="entry-total" aria-live="polite">' +
        '<span class="entry-total-label">Total</span>' +
        '<span class="entry-total-value" id="totalPreview">' + formatINR(0) + "</span>" +
        "</div>" +

        '<button type="submit" class="btn btn-primary btn-lg btn-block mt-1" id="saveBtn">' +
        ICON_PLUS + "Save transaction" +
        "</button>" +
        "</form>" +
        "</div>" +
        "</section>" +

        "<!-- Right column -->" +
        '<div>' +
        '<section class="card" aria-label="Quick services">' +
        '<div class="card-header"><h3>Quick services</h3></div>' +
        '<div class="card-body">' +
        '<div class="quick-grid" id="quickGrid">' +
        '<div class="state"><span class="spinner" aria-hidden="true"></span><p class="muted">Loading&hellip;</p></div>' +
        "</div>" +
        '<p class="small muted mt-1" id="quickHint" style="margin-bottom:0;">Tap a service to start a sale.</p>' +
        "</div></section>" +

        '<section class="card mt-2" aria-label="Today\'s transactions">' +
        '<div class="card-header"><h3>Today&rsquo;s transactions</h3>' +
        '<div class="card-actions">' +
        '<span class="small muted" id="todayCount"></span>' +
        '<button type="button" class="btn btn-secondary btn-sm" id="todayRefreshBtn" title="Refresh today\'s entries">Refresh</button>' +
        "</div></div>" +
        '<div class="table-wrap"><table class="table txn-table">' +
        "<thead><tr>" +
        "<th>Time</th><th>Customer</th><th>Service</th><th>Payment</th>" +
        '<th class="text-right">Amount</th>' +
        "</tr></thead>" +
        '<tbody id="todayBody">' +
        '<tr><td colspan="5"><div class="state"><span class="spinner" aria-hidden="true"></span>' +
        '<p class="muted">Loading&hellip;</p></div></td></tr>' +
        "</tbody></table></div>" +
        '<div class="txn-footer small muted" id="todayFooter">&nbsp;</div>' +
        "</section>" +
        "</div>" +
        "</div>" +
        "</section>";

      wireForm();
      await Promise.all([loadServices(), reloadToday()]);
    }

    /* =========================================================
       Form wiring
       ========================================================= */
    function wireForm() {
      const addBox = document.getElementById("addServiceBox");
      const addToggle = document.getElementById("addServiceToggle");

      addToggle.addEventListener("click", () => {
        addBox.classList.toggle("is-hidden");
        if (!addBox.classList.contains("is-hidden")) {
          setTimeout(() => document.getElementById("newServiceName").focus(), 40);
        }
      });
      document.getElementById("addServiceCancel").addEventListener("click", () => {
        addBox.classList.add("is-hidden");
      });
      document.getElementById("addServiceSave").addEventListener("click", saveNewService);

      document.getElementById("serviceSelect").addEventListener("change", (e) => {
        const id = e.target.value;
        if (!id) {
          selectedService = null;
          document.getElementById("rateInput").value = "";
        } else {
          pickService(id);
        }
        updateTotal();
      });

      document.getElementById("qtyInput").addEventListener("input", updateTotal);
      document.getElementById("rateInput").addEventListener("input", updateTotal);

      document.querySelectorAll("#methodRow .seg-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          paymentMethod = btn.dataset.method;
          document.querySelectorAll("#methodRow .seg-btn").forEach((b) => b.classList.toggle("is-active", b === btn));
          updateTotal();
        });
      });

      document.getElementById("todayRefreshBtn").addEventListener("click", () => {
        const btn = document.getElementById("todayRefreshBtn");
        setLoading(btn, true);
        reloadToday().finally(() => setLoading(btn, false));
      });

      document.getElementById("txnForm").addEventListener("submit", onSave);

      window.addEventListener("seva:new-txn", () => {
        focusFirstField();
      });
    }

    function focusFirstField() {
      const sel = document.getElementById("serviceSelect");
      if (sel) {
        sel.focus();
        sel.scrollIntoView({ block: "nearest", behavior: "smooth" });
      }
    }

    function showFormMsg(message, type = "error") {
      const box = document.getElementById("formMsg");
      if (!box) return;
      box.classList.remove("is-hidden");
      box.className = "alert alert-" + (type === "error" ? "error" : "warning") + " is-visible";
      box.querySelector("[data-form-msg]").textContent = message;
    }
    function hideFormMsg() {
      const box = document.getElementById("formMsg");
      if (box) box.classList.add("is-hidden");
    }

    /* =========================================================
       Services
       ========================================================= */
    async function loadServices() {
      try {
        services = await fetchServices();
      } catch (err) {
        console.warn("[seva-ledger] services:", err);
        services = [];
      }
      renderServiceSelect();
      renderQuickGrid();

      /* Pre-select when the dashboard forwarded a service. */
      const preselect = sessionStorage.getItem("seva.preselectService");
      if (preselect) {
        sessionStorage.removeItem("seva.preselectService");
        if (services.some((s) => s.serviceId === preselect)) {
          pickService(preselect);
        }
      }
      document.getElementById("quickHint").textContent = services.length
        ? "Tap a service to start a sale."
        : "No services yet — use \u201CAdd service\u201D above to create your first one.";
    }

    function renderServiceSelect() {
      const sel = document.getElementById("serviceSelect");
      const opts =
        '<option value="">Select a service&hellip;</option>' +
        services
          .map(
            (s) =>
              '<option value="' + escapeHtml(s.serviceId) + '">' +
              escapeHtml(s.name) +
              (s.pricePaise > 0 ? " \u00B7 " + formatINR(s.pricePaise) : "") +
              "</option>"
          )
          .join("");
      sel.innerHTML = opts;
    }

    function quickCode(s) {
      const fromName = (s.name || "")
        .replace(/[^a-zA-Z0-9\s]/g, "")
        .trim()
        .split(/\s+/)
        .map((w) => w[0] || "")
        .join("")
        .toUpperCase();
      return (s.code || fromName || "SV").slice(0, 2);
    }

    function renderQuickGrid() {
      const grid = document.getElementById("quickGrid");
      if (!grid) return;
      grid.innerHTML =
        services
          .slice(0, 16)
          .map(
            (s) =>
              '<button type="button" class="quick-service" tabindex="-1" data-id="' + escapeHtml(s.serviceId) + '">' +
              '<span class="qs-icon">' + escapeHtml(quickCode(s)) + "</span>" +
              '<span class="qs-name">' + escapeHtml(s.name) + "</span>" +
              '<span class="qs-price">' + (s.pricePaise >= 0 ? formatINR(s.pricePaise) : "&nbsp;") + "</span>" +
              "</button>"
          )
          .join("") ||
        '<div class="state" style="padding:1rem 0;"><p class="muted" style="margin:0;">No services yet.</p></div>';
      grid.querySelectorAll(".quick-service").forEach((btn) => {
        btn.addEventListener("click", () => pickService(btn.dataset.id));
      });
    }

    function pickService(id) {
      const svc = services.find((s) => s.serviceId === id);
      if (!svc) return;
      selectedService = svc;
      document.getElementById("serviceSelect").value = id;
      document.getElementById("rateInput").value = paiseToInput(svc.pricePaise);
      document.getElementById("qtyInput").value = "1";
      hideFormMsg();
      updateTotal();
      document.getElementById("qtyInput").focus();
    }

    async function saveNewService() {
      const name = document.getElementById("newServiceName").value.trim();
      const rate = document.getElementById("newServiceRate").value;
      const btn = document.getElementById("addServiceSave");
      if (!name) {
        toast("Enter a service name.", "error");
        return;
      }
      if (rateToPaise(rate) === null) {
        toast("Enter a valid rate.", "error");
        return;
      }
      setLoading(btn, true);
      try {
        const created = await createService({ name, price: rate });
        await loadServices();
        document.getElementById("addServiceBox").classList.add("is-hidden");
        pickService(created.serviceId);
        toast('Service "' + created.name + '" added.', "success");
      } catch (err) {
        toast(reportError(err), "error");
      } finally {
        setLoading(btn, false);
      }
    }

    /* =========================================================
       Live total + validation preview
       ========================================================= */
    function updateTotal() {
      const qty = sanitizeQuantity(document.getElementById("qtyInput").value);
      const ratePaise = rateToPaise(document.getElementById("rateInput").value);
      const total = computeTotalPaise(qty, ratePaise);
      const preview = document.getElementById("totalPreview");
      const hint = document.getElementById("methodHint");

      if (total === null || qty === null || ratePaise === null) {
        preview.textContent = formatINR(0);
        if (hint) hint.textContent = "Enter a valid quantity and rate.";
        return;
      }
      preview.textContent = formatINR(total);
      if (hint) {
        hint.textContent =
          paymentMethod === "due"
            ? "Recorded as pending \u2014 it will count as due until paid."
            : "Recorded as paid (" + methodLabel(paymentMethod) + ").";
      }
    }

    /* =========================================================
       Save
       ========================================================= */
    async function onSave(event) {
      event.preventDefault();
      if (saving) return; // double-submit guard
      hideFormMsg();

      const qty = sanitizeQuantity(document.getElementById("qtyInput").value);
      const ratePaise = rateToPaise(document.getElementById("rateInput").value);
      const total = computeTotalPaise(qty, ratePaise);
      const customer = document.getElementById("customerInput").value.trim();

      if (!selectedService) return showFormMsg("Choose a service for this sale.");
      if (qty === null) return showFormMsg("Quantity must be a whole number greater than 0.");
      if (ratePaise === null) return showFormMsg("Enter a valid rate (\u20B90 or more, up to \u20B91,00,000).");
      if (total === null) return showFormMsg("The total is out of the allowed range.");
      if (!isPaymentMethod(paymentMethod)) return showFormMsg("Choose a payment method.");

      saving = true;
      const btn = document.getElementById("saveBtn");
      setLoading(btn, true);
      try {
        const result = await createTransaction({
          serviceId: selectedService.serviceId,
          serviceName: selectedService.name,
          quantity: qty,
          rate: ratePaise / 100, // paise -> rupees input for createTransaction
          paymentMethod,
          customerName: customer,
          dateKey: todayKolkata(),
        });

        if (navigator.onLine) {
          toast("Transaction saved \u2014 " + formatINR(result.totalPaise) + ".", "success");
        } else {
          toast("Saved offline \u2014 " + formatINR(result.totalPaise) + ". Will sync automatically.", "success", 5200);
          if (!waitingSync) scheduleSyncConfirmation();
        }

        clearForm();
        reloadToday();
      } catch (err) {
        console.error("[seva-ledger] save:", err);
        showFormMsg(isNetworkError(err) ? "Could not save right now. Check your connection and try again." : reportError(err));
      } finally {
        saving = false;
        setLoading(btn, false);
      }
    }

    function clearForm() {
      document.getElementById("qtyInput").value = "1";
      document.getElementById("rateInput").value = selectedService ? paiseToInput(selectedService.pricePaise) : "";
      document.getElementById("customerInput").value = "";
      updateTotal();
      document.getElementById("qtyInput").focus();
    }

    function scheduleSyncConfirmation() {
      waitingSync = true;
      window.addEventListener(
        "online",
        async () => {
          try {
            await flushPendingWrites();
            setSyncState("online");
            toast("Changes synced.", "success");
            reloadToday();
          } catch (_) {
            /* still offline; try again next time */
          } finally {
            waitingSync = false;
          }
        },
        { once: true }
      );
    }

    /* =========================================================
       Today's transactions
       ========================================================= */
    function methodChips(t) {
      return '<span class="badge badge-method badge-' + t.paymentMethod + '">' +
        escapeHtml(t.methodLabel) +
        (t.status === "pending" ? ' <span class="badge badge-warning" style="margin-left:2px;">Pending</span>' : "") +
        "</span>";
    }

    function txnRow(t) {
      const customer = t.customerName || "Walk-in";
      const qtyInfo = t.quantity > 1 ? " &times; " + String(t.quantity) : "";
      return (
        "<tr>" +
        '<td class="txn-time">' + escapeHtml(formatKolkataTime(t.createdAt)) + "</td>" +
        '<td class="txn-customer"><div class="txn-clip">' + escapeHtml(customer) + "</div></td>" +
        '<td class="txn-service"><div class="txn-clip">' + escapeHtml(t.serviceName) + qtyInfo + "</div></td>" +
        "<td>" + methodChips(t) + "</td>" +
        '<td class="text-right txn-num">' + formatINR(t.totalPaise) + "</td>" +
        "</tr>"
      );
    }

    async function reloadToday() {
      const body = document.getElementById("todayBody");
      const footer = document.getElementById("todayFooter");
      const count = document.getElementById("todayCount");
      try {
        const summary = await fetchTodaySummary(todayKolkata());
        if (!body || !footer) return;
        if (!summary.transactions.length) {
          body.innerHTML =
            '<tr><td colspan="5"><div class="state">' +
            '<svg class="state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
            '<path d="M6 3h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M9 7h6M9 11h6M9 15h3"/></svg>' +
            "<h3>No transactions today</h3>" +
            "<p>Sales you record during the day will appear here.</p>" +
            "</div></td></tr>";
          footer.innerHTML = "&nbsp;";
          if (count) count.textContent = "";
        } else {
          body.innerHTML = summary.transactions.map(txnRow).join("");
          footer.innerHTML =
            summary.transactions.length === 1
              ? "1 transaction today."
              : summary.transactions.length + " transactions today.";
          if (count) {
            count.textContent = summary.transactions.length === 1 ? "1 today" : summary.transactions.length + " today";
          }
        }
      } catch (err) {
        console.error("[seva-ledger] today list:", err);
        if (body) {
          body.innerHTML =
            '<tr><td colspan="5"><div class="state is-error">' +
            '<svg class="state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>' +
            "<h3>Could not load today</h3>" +
            "<p>" +
            escapeHtml(
              isNetworkError(err)
                ? "You appear to be offline. Entries will sync automatically."
                : reportError(err)
            ) +
            "</p>" +
            "</div></td></tr>";
        }
        if (footer) footer.innerHTML = "&nbsp;";
      }
    }

    /* =========================================================
       Boot
       ========================================================= */
    initAppShell({
      page: "transactions",
      onReady: renderPage,
      onDayChange: () => reloadToday(),
    });
  </script>
</body>
</html>
